```html
<!DOCTYPE html>
<html>
<head>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script>

        // Objeto clicável
        AFRAME.registerComponent('clicavel', {

            init: function () {

                this.el.addEventListener('click', function () {

                    // Escolhe uma cor aleatória
                    let cores = [
                        '#FF0000',
                        '#00FF00',
                        '#0000FF',
                        '#FFFF00',
                        '#FF00FF',
                        '#00FFFF'
                    ];

                    let cor =
                        cores[Math.floor(Math.random() * cores.length)];

                    // Muda a cor
                    this.setAttribute('color', cor);

                    // Faz o objeto aumentar
                    this.setAttribute(
                        'animation__escala',
                        'property: scale; to: 1.5 1.5 1.5; dur: 300'
                    );

                    // Volta ao tamanho normal
                    setTimeout(() => {

                        this.setAttribute(
                            'animation__escala2',
                            'property: scale; to: 1 1 1; dur: 300'
                        );

                    }, 300);

                });

            }

        });

    </script>

</head>

<body>

<a-scene>

    <!-- Céu -->
    <a-sky color="#87CEEB"></a-sky>


    <!-- Chão -->
    <a-plane
        position="0 0 -5"
        rotation="-90 0 0"
        width="30"
        height="30"
        color="#58D68D">
    </a-plane>


    <!-- OBJETO CLICÁVEL -->
    <a-box
        position="0 1 -4"
        width="2"
        height="2"
        depth="2"
        color="#FF69B4"
        clicavel>

        <!-- Texto -->
        <a-text
            value="CLIQUE EM MIM!"
            align="center"
            position="0 1.5 0"
            scale="1.5 1.5 1.5">
        </a-text>

    </a-box>


    <!-- Bola -->
    <a-sphere
        position="-4 1 -5"
        radius="1"
        color="#FFD700">
    </a-sphere>


    <!-- Pirâmide -->
    <a-cone
        position="4 1 -5"
        radius-bottom="1"
        radius-top="0"
        height="2"
        color="#9B59B6">
    </a-cone>


    <!-- Luz -->
    <a-light
        type="ambient"
        color="#FFFFFF"
        intensity="1">
    </a-light>

    <a-light
        type="directional"
        position="-5 8 5"
        intensity="1">
    </a-light>


    <!-- Câmera -->
    <a-camera position="0 3 8">
        <a-cursor></a-cursor>
    </a-camera>

</a-scene>

</body>
</html>
